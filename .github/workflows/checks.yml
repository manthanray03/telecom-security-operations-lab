name: checks

# Runs the tests and the strict data checks on every push, so a bad edit to the
# data (wrong permission name, analyst update for an incident that doesn't exist)
# fails the build.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python run_lab.py --strict --as-of 2026-11-20 --out build/reports
